<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抗 MASH 研究最终整合报告</title>
<style>
  @page { size: 794px 1123px; margin: 0; }
  :root { --page:#f5f4f3; --ink:#262522; --muted:#7e7c74; --line:#4926b3; --block:#e8e7e2; --border:#d5cfba; }
  html, body { margin:0; padding:0; width:794px; height:1123px; background:var(--page); font-family:"Microsoft YaHei","SimHei",sans-serif; }
  .cover { position:relative; width:794px; height:1123px; background:var(--page); }
  .bg { position:absolute; inset:0; overflow:hidden; z-index:1; }
  .bg .year { position:absolute; right:46px; top:112px; color:rgba(73,38,179,.045); font-size:178px; font-weight:700; letter-spacing:-10px; line-height:1; }
  .bg .circle { position:absolute; width:310px; height:310px; border:1px solid rgba(73,38,179,.12); border-radius:50%; right:28px; bottom:48px; }
  .bg .circle::after { content:""; position:absolute; inset:58px; border:1px solid rgba(73,38,179,.08); border-radius:50%; }
  .lines { position:absolute; inset:0; z-index:2; }
  .topbar { position:absolute; top:0; left:0; right:0; height:15px; background:var(--line); }
  .anchor { position:absolute; left:74px; top:174px; width:6px; height:714px; background:var(--line); }
  .divider { position:absolute; left:136px; top:750px; width:385px; height:1px; background:rgba(73,38,179,.38); }
  .content { position:absolute; inset:0; z-index:3; }
  .kicker { position:absolute; left:136px; top:164px; color:var(--muted); font-size:15px; letter-spacing:3px; }
  h1 { position:absolute; left:136px; top:273px; margin:0; width:540px; color:var(--ink); font-size:54px; line-height:1.22; font-weight:700; letter-spacing:1px; }
  .subtitle { position:absolute; left:139px; top:437px; width:485px; color:#5a5751; font-size:21px; line-height:1.55; }
  .summary { position:absolute; left:139px; top:575px; width:470px; color:var(--ink); font-size:17px; line-height:1.75; }
  .meta { position:absolute; left:139px; top:805px; color:var(--ink); font-size:18px; line-height:1.65; }
  .footer { position:absolute; left:139px; bottom:108px; color:var(--muted); font-size:14px; letter-spacing:2px; }
  @media screen { html { background:#d7d4cd; } body { transform:scale(.78); transform-origin:top left; } }
</style>
</head>
<body>
<section class="cover">
  <div class="bg"><div class="year">2026</div><div class="circle"></div></div>
  <div class="lines"><div class="topbar"></div><div class="anchor"></div><div class="divider"></div></div>
  <div class="content">
    <div class="kicker">研究结题与实验决策报告</div>
    <h1>抗 MASH<br>研究最终整合报告</h1>
    <div class="subtitle">干实验审计结论、候选证据分层与湿实验执行方案</div>
    <div class="summary">整合原始 FXR/CW-BCS 主线、COCONUT 多靶点扩展、圆桌修订和独立 THR-beta/FASN/SCD1 重建。报告明确各路线的可复现结果与证据边界，并将下一步工作收敛为可执行、可淘汰的湿实验路径。</div>
    <div class="meta">研究范围：项目文件夹全量审计后的可追溯结果<br>核心定位：计算优先级假设，不等同于疗效验证</div>
    <div class="footer">FINAL INTEGRATED REPORT · 2026-08-24</div>
  </div>
</section>
</body>
</html>
